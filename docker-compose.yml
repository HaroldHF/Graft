# Local development infrastructure for Graft (PostgreSQL + Redis).
# Matches default connection settings in `.env.example`.
# Usage: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: graft-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-graft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graft}
      POSTGRES_DB: ${POSTGRES_DB:-graft}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - graft_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-graft} -d $${POSTGRES_DB:-graft}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: graft-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - graft_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  graft_pgdata:
  graft_redisdata:
