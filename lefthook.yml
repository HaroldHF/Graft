# Lefthook configuration for Graft
# Install locally: lefthook install

pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  commands:
    gitleaks:
      priority: 1
      run: gitleaks protect --staged --redact --no-banner

    gofmt:
      priority: 2
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

    golangci-lint:
      priority: 3
      glob: "*.go"
      run: golangci-lint run ./cmd/... ./internal/...

    # Uncomment when sqlc.yaml and SQL migrations are added in Phase 1:
    # sqlc-vet:
    #   glob: "{*.sql,sqlc.yaml}"
    #   run: sqlc vet

    # Uncomment when React + TypeScript dashboard in web/ is added in Phase 3:
    # web-biome:
    #   root: "web/"
    #   glob: "*.{ts,tsx,js,jsx,json,css}"
    #   run: npx biome check --staged {staged_files}

commit-msg:
  skip:
    - merge
    - rebase
  commands:
    conventional-commit:
      run: >-
        head -n1 '{1}' | tr -d '\r' | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|spike)(\([a-z0-9._/-]+\))?!?: .*[^[:space:]].*' || (echo 'Error: commit message must follow Conventional Commits: <type>(optional-scope): <description>' >&2 && echo 'Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, spike' >&2 && exit 1)

pre-push:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    go-test:
      run: >-
        if command -v gcc >/dev/null 2>&1; then
          CGO_ENABLED=1 go test -short -race ./...;
        else
          echo "WARN: gcc not found on PATH; running go test -short ./... locally (CI enforces -race on Linux)" >&2;
          go test -short ./...;
        fi

    # Uncomment when React + TypeScript dashboard in web/ is added in Phase 3:
    # web-typecheck:
    #   root: "web/"
    #   run: npx tsc --noEmit
