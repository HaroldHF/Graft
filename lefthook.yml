# Lefthook configuration for Graft
# Install locally after `git init`: lefthook install
# Current phase: Phase 0 (Docs & Technical Spikes) — lightweight secret & commit checks only.

pre-commit:
  parallel: true
  fail_fast: false
  skip:
    - merge
    - rebase
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --no-banner

commit-msg:
  skip:
    - merge
    - rebase
  commands:
    conventional-commit:
      run: |
        head -n1 "{1}" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert|spike)(\([a-z0-9._/-]+\))?!?: .+' || {
          echo "Error: commit message must follow Conventional Commits: <type>(optional-scope): <description>"
          echo "Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert, spike"
          exit 1
        }

